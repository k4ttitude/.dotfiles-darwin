gui:
  # Default is 0.3333, which leaves the diff only ~2/3 of the terminal.
  # A narrower side panel gives side-by-side diffs room to breathe.
  sidePanelWidth: 0.2

git:
  pagers:
    - colorArg: always
      # Side-by-side diffs via delta, stripped of chrome.
      #
      # Deliberately NO --width: lazygit runs git inside a pty sized to the
      # panel (pkg/gui/pty.go), so delta detects the real width on its own.
      # Do not use --width={{columnWidth}} here -- that template resolves to
      # (panelWidth / 2) - 6 and exists for ydiff, whose --width is per-column.
      # delta's --width is the TOTAL width, so it would squeeze both columns
      # into half the panel.
      pager: >-
        delta --dark --paging=never --side-by-side
        --file-decoration-style=none
        --hunk-header-style=omit
        --line-numbers-left-format="{nm:>3} "
        --line-numbers-right-format="{np:>3} "
