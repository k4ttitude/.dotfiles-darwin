# Runs when a file is opened with kitty (Finder "Open With", default app,
# drag onto the dock icon, `open -a kitty FILE`).
# First matching entry wins. Defaults: `kitty +open --help` / kitty docs "open_actions".

# Directories: new tab with a shell in that directory
protocol file
mime inode/directory
action launch --type=tab --cwd -- $FILE_PATH

# Everything else: edit in nvim, in a new tab of the active kitty window
protocol file
action launch --type=tab --tab-title $FILE -- nvim -- $FILE_PATH
